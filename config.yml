# =========================================================
#  OOOL RFP Finder - settings
#  You can edit this file right on GitHub (pencil icon).
# =========================================================

# Which states to cover. Add more any time, e.g. [FL, CA, TX, GA]
states: [ALL]

# Do these states first (the rest fill in over the next runs)
priority_states: [FL]

# Max minutes per run spent finding district bids pages (the rest continues next run)
discover_minutes: 75

# Include charter school organizations too? (CA has 1,000+ of them)
include_charters: false

# Board meeting agendas on BoardDocs (early warning before RFPs).
# BoardDocs asks bots not to visit (robots.txt). Leave false unless your VP says OK.
check_boarddocs: true

# Shown to website owners in their logs so they know who is visiting.
contact_email: "msuarez@oneononelearning.com"

# Be polite: seconds to wait between requests to the same website.
delay_seconds: 2

# How many websites to check at the same time (different sites only).
parallel_sites: 24

# Respect each website's robots.txt rules (recommended: keep true).
respect_robots_txt: true

# How long to keep old items on the dashboard (days since last seen).
keep_days: 120

# Time limits per daily run (GitHub stops a run after 6 hours)
rfp_minutes: 45          # checking district bids pages
meetings_minutes: 180    # reading board meetings, budgets and plans

# Re-check each district's meetings / bids page every N days (spreads the work out)
meetings_every_days: 3
rfp_every_days: 3

# On the first look at a district, go back this many days in its meetings
meetings_lookback_days: 90

# Wait between requests to BoardDocs (seconds). All districts share one BoardDocs server.
boarddocs_delay_seconds: 1.5

# Max bid documents (PDF/Word) to open per source each run.
max_docs_per_source: 15

# Read the bot Gmail inbox for portal alerts and Google Alerts emails.
inbox:
  enabled: false   # portal emails (BidNet, VendorLink...) turned off
  folder: INBOX
  first_run_days: 14   # how far back to look the very first time

