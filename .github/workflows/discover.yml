name: Find districts (monthly)

on:
  schedule:
    # 1st of every month at 08:41 UTC
    - cron: "41 8 1 * *"
  workflow_dispatch:
    inputs:
      redo_all:
        description: "Re-check every district (not just new/old ones)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rfp-finder
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find every district's bids page
        run: python discover.py ${{ inputs.redo_all && '--all' || '' }}
      - name: Save
        run: |
          git config user.name "rfp-finder-bot"
          git config user.email "rfp-finder-bot@users.noreply.github.com"
          git add data/districts.json sources_auto.csv
          git diff --cached --quiet && exit 0
          git commit -m "District list update $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
